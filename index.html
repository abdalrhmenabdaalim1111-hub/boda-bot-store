<style>
:root {
  --bg:      var(--tg-theme-bg-color,              #17212b);
  --surface: var(--tg-theme-secondary-bg-color,  #232e3c);
  --text:    var(--tg-theme-text-color,            #ffffff);
  --hint:    var(--tg-theme-hint-color,            #aaaaaa);
  --accent:  var(--tg-theme-button-color,          #5288c1);
  --btn-txt: var(--tg-theme-button-text-color,    #ffffff);
  --link:    var(--tg-theme-link-color,            #62bcf9);
  --danger:  #e0554d; --ok: #4dae4e; --warn: #e8a33d;
  --radius: 14px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; padding: 14px 14px 90px;
  transition: background .25s, color .25s;
}
.container { max-width: 520px; margin: 0 auto; }

/* ── Header ── */
.app-header { text-align: center; padding: 18px 0 14px; }
.app-header .emoji { font-size: 44px; display: block; margin-bottom: 6px;
  filter: drop-shadow(0 4px 14px rgba(82,136,193,.45)); }
.app-header h1 { font-size: 22px; font-weight: 700; letter-spacing: .3px; }
.app-header p  { color: var(--hint); font-size: 13px; margin-top: 4px; }

/* ── Card ── */
.card {
  background: var(--surface); border-radius: var(--radius);
  padding: 16px; margin-bottom: 12px;
  box-shadow: 0 2px 10px rgba(0,0,0,.14);
}
.card h2 { font-size: 15px; margin-bottom: 12px; color: var(--text); }

/* ── Inputs ── */
input[type=text], input[type=number], input[type=date], textarea, select {
  width: 100%; padding: 12px 14px; border: 1.5px solid transparent;
  border-radius: 10px; background: var(--bg); color: var(--text);
  font-size: 15px; font-family: inherit; outline: none; transition: border .2s;
}
input:focus, textarea:focus, select:focus { border-color: var(--accent); }
textarea { min-height: 90px; resize: vertical; }
label { display: block; font-size: 12.5px; color: var(--hint); margin: 10px 0 5px; }

/* ── Buttons ── */
.btn {
  display: block; width: 100%; border: none; cursor: pointer;
  background: var(--accent); color: var(--btn-txt);
  padding: 13px; border-radius: 11px; font-size: 15.5px; font-weight: 700;
  font-family: inherit; margin-top: 12px; transition: transform .12s, opacity .2s;
}
.btn:active { transform: scale(.97); opacity: .85; }
.btn.secondary { background: var(--bg); color: var(--link); border: 1.5px solid var(--link); }
.btn:disabled { opacity: .45; cursor: wait; }

/* ── Result box ── */
.result {
  margin-top: 14px; padding: 14px; border-radius: 11px;
  background: var(--bg); border: 1.5px dashed var(--accent);
  font-size: 15px; line-height: 1.9; display: none; word-break: break-word;
}
.result.show { display: block; animation: pop .25s ease; }
@keyframes pop { from { opacity: 0; transform: translateY(6px);} to { opacity: 1; transform: none;} }

/* ── Chips (اختيارات سريعة) ── */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.chip {
  padding: 8px 14px; border-radius: 999px; font-size: 13.5px; cursor: pointer;
  background: var(--bg); color: var(--text); border: 1.5px solid var(--hint);
  transition: all .15s; user-select: none;
}
.chip.active { background: var(--accent); color: var(--btn-txt); border-color: var(--accent); }

/* ── Toast ── */
#toast {
  position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%) translateY(20px);
  background: var(--accent); color: var(--btn-txt); padding: 10px 20px;
  border-radius: 999px; font-size: 14px; opacity: 0; pointer-events: none;
  transition: all .3s; z-index: 99; white-space: nowrap;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ══ AdSDK ══ */
.ad-banner {
  margin: 12px 0 0; padding: 10px 12px; border-radius: 10px;
  background: linear-gradient(135deg, rgba(232,163,61,.16), rgba(232,163,61,.07));
  border: 1px solid rgba(232,163,61,.4); font-size: 13px; line-height: 1.7;
  display: none; align-items: center; gap: 8px;
}
.ad-banner.show { display: flex; }
.ad-banner .ad-icon { font-size: 18px; }
.ad-banner a { color: var(--link); font-weight: 700; text-decoration: none; }

#sponsor-overlay {
  position: fixed; inset: 0; z-index: 200; display: none;
  background: rgba(0,0,0,.72); backdrop-filter: blur(6px);
  align-items: center; justify-content: center; padding: 20px;
}
#sponsor-overlay.show { display: flex; }
.sponsor-card {
  background: var(--surface); border-radius: 18px; padding: 24px 20px;
  max-width: 340px; width: 100%; text-align: center;
  animation: pop .3s ease; border: 1.5px solid rgba(232,163,61,.5);
}
.sponsor-card .sp-badge {
  display: inline-block; font-size: 11px; letter-spacing: 1.5px;
  color: var(--warn); border: 1px solid var(--warn);
  padding: 3px 12px; border-radius: 999px; margin-bottom: 12px;
}
.sponsor-card h3 { font-size: 18px; margin-bottom: 8px; }
.sponsor-card p  { color: var(--hint); font-size: 13.5px; line-height: 1.8; margin-bottom: 16px; }
.sponsor-card .skip {
  display: block; margin-top: 10px; color: var(--hint);
  font-size: 12.5px; cursor: pointer; text-decoration: underline;
}

/* ── Footer ── */
.app-footer { text-align: center; color: var(--hint); font-size: 11.5px;
  margin-top: 22px; line-height: 2; }
.app-footer a { color: var(--link); text-decoration: none; }


.cats { display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:12px; }
.cats::-webkit-scrollbar { display:none; }
.cat { flex-shrink:0; padding:8px 14px; border-radius:999px; font-size:13.5px;
  cursor:pointer; background:var(--surface); border:1.5px solid var(--hint); }
.cat.active { background:var(--accent); color:var(--btn-txt); border-color:var(--accent); }
.search { width:100%; padding:12px 16px; border-radius:999px; border:1.5px solid transparent;
  background:var(--surface); color:var(--text); font-size:15px; outline:none; margin-bottom:4px; }
.search:focus { border-color:var(--accent); }
.app-card { display:flex; gap:12px; align-items:center; background:var(--surface);
  border-radius:14px; padding:14px; margin-bottom:10px; cursor:pointer;

.app-card .info { flex:1; min-width:0; }

.app-card p { color:var(--hint); font-size:12.5px; white-space:nowrap; overflow:hidden;

.app-card .meta { color:var(--link); font-size:11.5px; margin-top:4px; }
.badge-new { background:var(--warn); color:#111; font-size:10px; font-weight:800;
  padding:2px 8px; border-radius:999px; margin-inline-start:6px; vertical-align:middle; }
.badge-soon { background:var(--hint); color:var(--bg); font-size:10px; font-weight:800;
  padding:2px 8px; border-radius:999px; margin-inline-start:6px; vertical-align:middle; }
.app-card.soon { opacity:.55; }
.hero { background:linear-gradient(135deg,rgba(82,136,193,.25),rgba(82,136,193,.08));

  text-align:center; margin-bottom:14px; }
.hero .big { font-size:34px; }

.stat-row { display:flex; gap:8px; margin-top:12px; }
.stat { flex:1; background:var(--bg); border-radius:11px; padding:10px 6px; }
.stat b { font-size:17px; display:block; }
.stat span { font-size:11px; color:var(--hint); }
</style>

<script>
/* ═════════ Boda MiniApp Core ═════════
   توكن البوت لا يوضع هنا أبداً — التكامل عبر Telegram WebApp الرسمي فقط.
   الإعلانات والتتبع يعملان حتى بدون خادم (fallback صامت). */
(function(){
  const API_BASE = window.__BODA_API__ || '';      // يُحقن من المولّد أو '' محلياً
  const BOT_ID   = window.__BODA_BOT_ID__ || 'unknown';
  const tg       = window.Telegram && window.Telegram.WebApp;

  /* ── Telegram init ── */
  function initTelegram(){
    if (!tg) return;
    try {
      tg.ready(); tg.expand();
      tg.setHeaderColor('secondary_bg_color');
      tg.setBackgroundColor('secondary_bg_color');
      if (tg.enableClosingConfirmation) tg.enableClosingConfirmation();
    } catch(e){}
  }

  /* ── User (بدون أي بيانات حساسة — اسم وid فقط للعرض) ── */
  function getUser(){
    if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
      const u = tg.initDataUnsafe.user;
      return { id: u.id, name: [u.first_name,u.last_name].filter(Boolean).join(' ') };
    }
    return null;
  }

  /* ── Track: إرسال حدث للـ API (best-effort) ── */
  function track(event, extra){
    try {
      const u = getUser();
      const payload = Object.assign({ bot: BOT_ID, event: event, user_id: u ? u.id : 0 }, extra||{});
      if (API_BASE) {
        fetch(API_BASE + '/api/track', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify(payload)
        }).catch(function(){});
      }
      // نسخة محلية للتطوير
      try {
        const k='boda_events'; const arr=JSON.parse(localStorage.getItem(k)||'[]');
        arr.push(Object.assign({t:Date.now()},payload));
        localStorage.setItem(k, JSON.stringify(arr.slice(-50)));
      } catch(e){}
    } catch(e){}
  }

  /* ═════════ AdSDK ═════════ */
  const Ad = {
    cfg: (window.__BODA_ADS__ || { banner:null, sponsor:null, every:5 }),

    /** بانر سفلي داخل الصفحة — يظهر حسب التكرار */
    mountBanner(){
      const b = this.cfg.banner; if (!b) return;
      let count = +(localStorage.getItem('boda_ad_n_'+BOT_ID)||0) + 1;
      localStorage.setItem('boda_ad_n_'+BOT_ID, count);
      if (count % (this.cfg.every||3) !== 0) return;      // التكرار المضبوط
      const el = document.createElement('div');
      el.className='ad-banner';
      el.innerHTML = '<span class="ad-icon">'+(b.icon||'📢')+'</span><div>'+ b.html +'</div>';
      el.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>track('ad_click',{placement:'banner'})));
      document.querySelector('.container').appendChild(el);
      el.classList.add('show');
      track('ad_view',{placement:'banner'});
    },

    /** شاشة Sponsored كل N استخدامات — مع تخطٍ بعد ثوانٍ */
    maybeSponsor(){
      const s = this.cfg.sponsor; if (!s) return;
      let uses = +(localStorage.getItem('boda_uses_'+BOT_ID)||0) + 1;
      localStorage.setItem('boda_uses_'+BOT_ID, uses);
      if (uses % (this.cfg.every||5) !== 1) return;       // أول استخدام + كل N
      const ov = document.createElement('div');
      ov.id='sponsor-overlay';
      ov.innerHTML =
        '<div class="sponsor-card">'+
        '<span class="sp-badge">✦ SPONSORED</span>'+
        '<h3>'+ s.title +'</h3><p>'+ s.text +'</p>'+
        '<button class="btn" id="sp-go">'+ (s.button||'زيارة الراعي') +' ↗</button>'+
        '<span class="skip">متابعة للتطبيق</span></div>';
      document.body.appendChild(ov);
      requestAnimationFrame(()=>ov.classList.add('show'));
      track('ad_view',{placement:'sponsor'});
      ov.querySelector('#sp-go').onclick = function(){
        track('ad_click',{placement:'sponsor'});
        try { if (tg) tg.openLink(s.url); else window.open(s.url,'_blank'); } catch(e){}
        close();
      };
      const close = ()=>{ ov.classList.remove('show'); setTimeout(()=>ov.remove(), 250); };
      ov.querySelector('.skip').onclick = close;
    }
  };

  /* ── أدوات ── */
  function toast(msg){
    let t = document.getElementById('toast');
    if (!t){ t=document.createElement('div'); t.id='toast'; document.body.appendChild(t); }
    t.textContent = msg; t.classList.add('show');
    clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 2200);
  }
  function haptic(type){
    try { if (tg && tg.HapticFeedback) tg.HapticFeedback.impactOccurred(type||'light'); } catch(e){}
  }
  function copy(text, okMsg){
    const done = ()=>{ toast(okMsg||'✅ تم النسخ'); haptic('success'); };
    if (navigator.clipboard) navigator.clipboard.writeText(text).then(done).catch(()=>fallback());
    else fallback();
    function fallback(){
      const ta=document.createElement('textarea'); ta.value=text; document.body.appendChild(ta);
      ta.select(); try{document.execCommand('copy');}catch(e){} ta.remove(); done();
    }
  }
  function share(text, url){
    const link = url || window.__BODA_SHARE__ || 'https://t.me/BodaStoreeBot';
    const full = text + '\n\n' + link;
    try {
      if (tg && tg.openTelegramLink) {
        tg.openTelegramLink('https://t.me/share/url?url='+encodeURIComponent(link)+'&text='+encodeURIComponent(text));
      } else if (navigator.share) { navigator.share({text: full}); }
      else { copy(full, '📋 انسخه وشاركه'); }
    } catch(e){ copy(full, '📋 انسخه وشاركه'); }
    track('share');
  }

  /* ── Boot ── */
  function boot(){
    initTelegram();
    document.addEventListener('DOMContentLoaded', function(){
      Ad.maybeSponsor();
      Ad.mountBanner();
      track('app_open');
    });
  }
  boot();

  window.Boda = { track: track, toast: toast, haptic: haptic, copy: copy, share: share,
                  getUser: getUser, tg: tg, Ad: Ad };
})();
</script>
<script>
let APPS=[], CATS={}, stats={}, cat='الكل', q='';
const urlp=new URLSearchParams(location.search);
const CATEGORIZED = urlp.get('web')==='1';   // فتح كصفحة ويب يعرض كل التطبيقات

async function boot(){
  try { const r=await fetch('./data/stats.json'); stats=await r.json(); } catch(e){}
  try {
    const r=await fetch('./data/catalog.json');
    APPS=await r.json();
  } catch(e) { APPS=[]; }
  buildCats(); render();
  document.getElementById('s-users').textContent = fmt((stats.total_users||0));
  document.getElementById('s-apps').textContent  = APPS.length;
  const ev=stats.events||{};
  document.getElementById('s-opens').textContent = fmt(Object.entries(ev)
    .filter(([k])=>k.startsWith('app_open:')).reduce((s,[,v])=>s+v,0));
}
function fmt(n){ n=+n||0; return n>=1000?(n/1000).toFixed(1)+'K':n; }
function buildCats(){
  const box=document.getElementById('cats'); const set=new Set(APPS.map(a=>a.tag||'أخرى'));
  CATS=['الكل',...[...set].sort()];
  box.innerHTML=CATS.map(c=>'<span class="cat'+(c===cat?' active':'')+'" onclick="setCat(\''+c+'\',this)">'+c+'</span>').join('');
}
function setCat(c,el){ cat=c; document.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));
  el.classList.add('active'); render(); }
function render(){
  const list=APPS.filter(a=>(cat==='الكل'||a.tag===cat)&&
    (!q||(a.name+' '+a.short_desc+' '+(a.username||'')).toLowerCase().includes(q.toLowerCase())));
  // الظاهر أولاً، والمخفي (قريباً) آخراً
  list.sort((x,y)=>(x.hidden?1:0)-(y.hidden?1:0));
  document.getElementById('list').innerHTML = list.length? list.map(a=>{
    const st=(stats.bots||{})[a.id]||{};
    const isNew=a.added_date && !a.hidden && (Date.now()-new Date(a.added_date))<30*864e5;
    return '<div class="app-card'+(a.hidden?' soon':'')+'" onclick="openApp(\''+a.url+'\',\''+a.web+'\')">'+
      '<div class="ic">'+a.emoji+'</div>'+
      '<div class="info"><h3>'+a.name+(isNew?'<span class="badge-new">جديد</span>':'')+
        (a.hidden?'<span class="badge-soon">قريباً</span>':'')+'</h3>'+
      '<p>'+(a.description||a.short_desc)+'</p>'+
      '<div class="meta">'+(a.username?'<b dir="ltr">'+a.username+'</b> · ':'')+'👥 '+
        (st.users?st.users+' مستخدم':'جديد على المنصة')+
        (st.active_30d?' · 🔥 '+st.active_30d+' نشط هذا الشهر':'')+'</div></div>'+
      '<div style="color:var(--hint);font-size:20px">‹</div></div>';
  }).join('') : '<p style="text-align:center;color:var(--hint);padding:30px 0">🔍 لا نتائج</p>';
}
function openApp(url, web){
  Boda.haptic('light'); Boda.track('store_open',{detail:web||url});
  try{ Boda.tg.openTelegramLink(url); }catch(e){ location.href=url; }
}
document.querySelector('.search').addEventListener('input',e=>{ q=e.target.value; render(); });
boot();
</script>
